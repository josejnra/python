[project]
name = "python-snippets"
version = "0.1.0"
description = "my python notes"
authors = [
    {name = "Jose Assis",email = "josenunesra@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "bokeh (>=3.9.1,<4.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "pydataset (>=0.2.0,<0.3.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "dask (>=2026.7.1,<2027.0.0)",
    "fastparquet (>=2026.5.0,<2027.0.0)",
    "line-profiler (>=5.0.2,<6.0.0)",
    "pycallgraph2 (>=1.1.3,<2.0.0)",
    "memray (>=1.19.3,<2.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "aiohttp (>=3.14.2,<4.0.0)",
    "fastapi (>=0.139.2,<0.140.0)",
    "duckdb (>=1.5.4,<2.0.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "polars (>=1.43.0,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "mypy (>=2.3.0,<3.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.22,<0.16.0)"
]

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]
cache-dir = "/tmp/.ruff_cache"
exclude = []

[tool.ruff.lint]
preview = true
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "PL",  # pylint
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.mypy]
exclude = []
cache_dir = "/tmp/.mypy_cache"

[tool.taskipy.tasks]
lint = 'ruff check . && ruff check . --diff'
format = 'ruff check . --fix && ruff format .'
pre_test = "task lint"
test = "pytest --cov --cov-branch --cov-fail-under=75 --cov-report term --cov-report xml:coverage.xml"
post_test = "coverage html && mypy ."

[tool.pytest.ini_options]
cache_dir = "/tmp/.pytest_cache"
addopts = "-s -x -vv"
testpaths = [
    "tests"
]
